# Coolify variant of docker-compose.yml.
# Differences: no published ports (Coolify's proxy routes the domain to web:80), env vars
# set in the Coolify UI instead of a .env file, images always built from this repo's
# source, and the one-shot media job excluded from Coolify's health status.
#
# In Coolify: Build Pack "Docker Compose", Docker Compose Location "/docker-compose.coolify.yml",
# then give the "web" service your domain (e.g. https://gym.example.com).

services:
  # One-time: download the exercise images + GIFs into ./media (skipped if already there).
  media:
    image: alpine/git
    exclude_from_hc: true
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  api:
    build: ./api
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - COACH_CODEX_HOME=/codex
      - RP_ID=${RP_ID:?set RP_ID to your domain, e.g. gym.example.com}
      - ORIGIN=${ORIGIN:?set ORIGIN to your https URL, e.g. https://gym.example.com}
      - RP_NAME=${RP_NAME:-openGym}
      - ADMIN_UIDS=${ADMIN_UIDS:-}
      - INVITE_ONLY=${INVITE_ONLY:-}
      - SESSION_DAYS=${SESSION_DAYS:-90}
      - COACH_DISABLED=${COACH_DISABLED:-}
    volumes:
      - ./data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP
      - ./data/codex:/codex

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
